<!-- [NAV-01] NAVEGACIÓN SUPERIOR (logo, secciones, buscador y acciones) -->
<header id="k-header" class="k-header">
    <div class="k-header__row">
        <div class="k-header__logo cursor-pointer select-none" onclick="navegarA('dashboard')"><span class="k-logo__txt" style="font-family: 'Maven Pro', sans-serif; font-weight: 900; letter-spacing: -0.05em;">KODA<span class="text-koda-blue">.</span></span></div>
        <nav class="k-tabs-nav" aria-label="Main navigation">
            <!-- Se conserva #nav-slider porque el código de navegación lo usa; en este diseño está oculto -->
            <div id="nav-slider" class="hidden" style="width: 0px; transform: translateX(0px);"></div>
            <button id="nav-btn-dashboard" onclick="animarYNavegar(this, 'dashboard')" class="nav-item k-tab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="7" height="9" x="3" y="3" rx="1" /> <rect width="7" height="5" x="14" y="3" rx="1" /> <rect width="7" height="9" x="14" y="12" rx="1" /> <rect width="7" height="5" x="3" y="16" rx="1" /></svg><span class="k-tab__txt">Dashboard</span></button>
            <button id="nav-btn-sobres" onclick="animarYNavegar(this, 'sobres')" class="nav-item k-tab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11h3.75a2 2 0 0 1 1.6.8l.45.6a4 4 0 0 0 6.4 0l.45-.6a2 2 0 0 1 1.6-.8H21" /> <path d="M3 7h18" /> <rect x="3" y="3" width="18" height="18" rx="2" /></svg><span class="k-tab__txt">Envelopes</span></button>
            <button id="nav-btn-compromisos" onclick="animarYNavegar(this, 'compromisos')" class="nav-item k-tab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 16H8" /> <path d="M14 8H8" /> <path d="M16 12H8" /> <path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z" /></svg><span class="k-tab__txt">Obligations</span></button>
            <button id="nav-btn-metas" onclick="animarYNavegar(this, 'metas')" class="nav-item k-tab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <circle cx="12" cy="12" r="6" /> <circle cx="12" cy="12" r="2" /></svg><span class="k-tab__txt">Goals</span></button>
            <button id="nav-btn-checkpay" onclick="animarYNavegar(this, 'checkpay')" class="nav-item k-tab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.801 10A10 10 0 1 1 17 3.335" /> <path d="m9 11 3 3L22 4" /></svg><span class="k-tab__txt">Check Pay</span></button>
        </nav>
        <div class="k-search" id="k-search">
            <span class="k-search__ico"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></span>
            <input id="k-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search transactions, envelopes, accounts…" aria-label="Search" oninput="kodaBuscarGlobal(this.value)" onfocus="kodaBuscarGlobal(this.value)" onkeydown="kodaBuscarTecla(event)">
            <div id="k-search-panel" class="k-search__panel hidden"></div>
        </div>
        <div class="k-header__actions">
            <button type="button" id="k-search-btn" onclick="kodaToggleBuscadorMovil()" title="Search" class="k-iconbtn k-searchbtn"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></button>
            <button id="btn-asistente" type="button" onclick="toggleAsistente()" title="Ask KODA" class="koda-orb-btn">
            <span class="koda-orb"></span><span class="koda-orb-ring"></span>
        </button>
            <div class="relative">
                <button onclick="toggleNotificaciones()" type="button" title="Notifications" class="k-iconbtn relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.268 21a2 2 0 0 0 3.464 0" /> <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg>
                    <span id="badge-notif" class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-koda-blue rounded-full border-2 border-white dark:border-koda-darkBg hidden animate-pulse"></span>
                </button>
                <div id="panel-notificaciones" class="hidden absolute right-0 mt-3 w-80 bg-[#331a3f] border border-white/10 rounded-2xl shadow-2xl p-3 z-50 backdrop-blur-md" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/5 px-1">
                    <span class="text-[11.5px] font-semibold text-koda-steel">Notifications</span>
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="marcarNotificacionesLeidas()" class="text-[11px] font-semibold text-koda-blue hover:text-white transition-colors cursor-pointer outline-none">Mark all read</button>
                        <button type="button" onclick="limpiarNotificaciones()" class="text-[11px] font-semibold text-koda-steel hover:text-white transition-colors cursor-pointer outline-none">Clear</button>
                    </div>
                </div>
                <div id="lista-notificaciones" class="flex flex-col gap-1 max-h-[360px] overflow-y-auto no-scrollbar"></div>
            </div>
            </div>
            <button type="button" onclick="kodaConfirmar('Sign out', 'You will need your access key to sign in again on this device.', () => kodaCerrarSesion(), 'Sign out', 'logout')" title="Sign out" class="k-iconbtn cursor-pointer outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 17 5-5-5-5" /> <path d="M21 12H9" /> <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>
            </button>
        </div>
    </div>
</header>

<!-- [NAV-02] CHAT FLOTANTE DEL ASISTENTE -->
<div id="panel-asistente" class="hidden fixed top-[88px] right-6 z-50 w-[380px] max-w-[calc(100vw-2rem)] h-[540px] max-h-[calc(100vh-110px)] bg-[#331a3f] border border-white/10 rounded-[1.5rem] shadow-2xl flex-col overflow-hidden" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/5">
        <div class="flex items-center gap-2.5">
            <span class="koda-orb sm"></span>
            <span class="text-[15px] font-semibold tracking-tight">Ask KODA</span>
        </div>
        <div class="flex items-center gap-1">
            <button type="button" onclick="nuevoChatAsistente()" title="New chat" class="w-8 h-8 rounded-full hover:bg-white/5 flex items-center justify-center text-koda-steel hover:text-white transition-colors cursor-pointer outline-none">
                <span class="material-symbols-outlined text-[19px]">edit_square</span>
            </button>
            <button type="button" onclick="cerrarAsistente()" title="Close" class="w-8 h-8 rounded-full hover:bg-white/5 flex items-center justify-center text-koda-steel hover:text-white transition-colors cursor-pointer outline-none">
                <span class="material-symbols-outlined text-[19px]">close</span>
            </button>
        </div>
    </div>
    <div id="asistente-mensajes" class="flex-1 overflow-y-auto no-scrollbar px-4 py-4 flex flex-col gap-3 select-text"></div>
    <form onsubmit="enviarAsistente(event)" class="px-4 pb-4 pt-2">
        <div class="bg-[#1f0f28] border border-white/5 rounded-2xl pl-4 pr-2 py-2 flex items-end gap-2 focus-within:border-koda-blue/50 transition-colors">
            <div class="flex-1 min-w-0 flex flex-col gap-0.5 py-1">
                <span class="text-[11.5px] font-semibold text-koda-steel">Message</span>
                <textarea id="asistente-entrada" rows="1" maxlength="1500" onkeydown="teclaAsistente(event)" oninput="ajustarEntradaAsistente()" class="w-full bg-transparent text-sm text-white font-medium border-none outline-none resize-none max-h-24 select-text"></textarea>
            </div>
            <button type="submit" id="asistente-enviar" class="w-9 h-9 mb-0.5 rounded-full bg-koda-blue text-[#2a1635] hover:bg-[#c384e4] flex items-center justify-center transition-colors cursor-pointer outline-none flex-shrink-0">
                <span class="material-symbols-outlined text-[19px]">arrow_upward</span>
            </button>
        </div>
    </form>
</div>
