    <style>

<script>
const KEY = 'koda_nube';
let cfg = null, D = {}, tipo = 'Gasto', vista = 'home', cargando = false, chat = [], pensando = false;

try { cfg = JSON.parse(localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
if (!cfg || !cfg.url || !cfg.token) location.replace('login.html?m=1');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => { n = Number(n) || 0; const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: Math.abs(n) % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (n < 0 ? '-$' : '$') + v; };

async function api(action, extra = {}) {
    const falla = (m, o) => Object.assign(new Error(m), o);   // red: sin conexión o servidor caído (se puede reintentar)
    let r;
    try { r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: cfg.token, action, ...extra }) }); }
    catch (e) { throw falla('No connection', { red: true }); }
    if (!r.ok) throw falla('Server answered ' + r.status, { red: true });
    let d; try { d = await r.json(); } catch (e) { throw falla('Invalid server response', { red: true }); }
    if (!d.ok) { if (/clave|key/i.test(d.error || '')) { salir(); throw falla(d.error, { auth: true }); } throw new Error(d.error || 'Unknown error'); }
    return d;
}

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }

function salir() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} location.replace('login.html?m=1'); }

function ir(v) {
    vista = v;
    document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
    document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.dataset.v === v));
    document.body.classList.toggle('chat-on', v === 'chat');
    $('b-ask').classList.toggle('on', v === 'chat');
    if (v === 'chat') pintarChat();
    scrollTo(0, 0);
}


function kodaLiquidez(cuentas, sobres, pendientes, compromisos) {
    const si = v => v === true || v === 'TRUE' || v === 'true';
    const marcadas = cuentas.filter(c => si(c.liquida));
    const base = marcadas.reduce((a, c) => a + (Number(c.saldo) || 0), 0);
    const enSobres = sobres.reduce((a, s) => a + Math.max(0, Number(s.monto) || 0), 0);
    const enBackups = compromisos.reduce((a, c) => a + (c.backup ? Math.max(0, Number(c.backup.monto) || 0) : 0), 0);
    const porPagar = pendientes.filter(i => !si(i.pagado)).filter(i => {
        if (i.tipoOrigen === 'fijo' || i.tipoOrigen === 'deuda') {
            const c = compromisos.find(x => x.id == i.refId && x.tipo === i.tipoOrigen);
            if (c && (c.afectaDisponible === false || c.afectaDisponible === 'FALSE' || c.afectaDisponible === 'false')) return false;
        }
        // Sobres, metas y manuales son solo lista: los sobres ya se restan en enSobres
        return i.tipoOrigen === 'fijo' || i.tipoOrigen === 'deuda';
    }).reduce((a, i) => a + (Number(i.monto) || 0), 0);
    return { hayMarcadas: marcadas.length > 0, nombres: marcadas.map(c => c.apodo), base, enSobres, enBackups, porPagar, libre: base - enSobres - enBackups - porPagar };
}
function cacheD() { try { localStorage.setItem('koda_movil_cache', JSON.stringify({ t: Date.now(), D })); } catch (e) {} }

/* ---- Cola de pendientes: lo anotado sin señal se guarda en el teléfono y se envía solo ---- */
const COLA_KEY = 'koda_movil_cola';
let cola = []; try { cola = JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); } catch (e) {}
let enviando = false;
const guardarCola = () => { try { localStorage.setItem(COLA_KEY, JSON.stringify(cola)); } catch (e) {} };
const nuevoCid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function fechaLocal() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

// Datos tal como se ven: lo guardado en la hoja + lo que aún espera para enviarse
function conPendientes() {
    const cu = JSON.parse(JSON.stringify(D.cuentas || [])), so = JSON.parse(JSON.stringify(D.sobres || [])), hi = (D.historial || []).slice();
    const ya = new Set(hi.map(m => m.refCliente).filter(Boolean));   // si la hoja ya lo tiene, no se cuenta dos veces
    const pend = cola.filter(i => !ya.has(i.cid));
    pend.filter(i => !i.fallo).forEach(i => {
        const c = cu.find(x => String(x.id) === String(i.cuentaId)); if (c) c.saldo = (Number(c.saldo) || 0) + (i.tipo === 'Ingreso' ? i.monto : -i.monto);
        if (i.tipo === 'Gasto' && i.sobre) { const s = so.find(x => x.nombre === i.sobre); if (s) s.monto = (Number(s.monto) || 0) - i.monto; }
    });
    pend.forEach(i => {
        const c = cu.find(x => String(x.id) === String(i.cuentaId));
        hi.push({ id: i.cid, tipo: i.tipo, monto: i.monto, desc: i.desc, categoria: i.sobre || i.categoria, cuentaOrigen: c ? c.apodo : '', fechaStr: i.fechaStr, pendiente: true, fallo: i.fallo, cid: i.cid });
    });
    return { cu, so, hi, n: pend.filter(i => !i.fallo).length, nFallo: pend.filter(i => i.fallo).length };
}

function aplicarEnD(it, mov) {
    const c = (D.cuentas || []).find(x => String(x.id) === String(it.cuentaId)); if (c) c.saldo = (Number(c.saldo) || 0) + (it.tipo === 'Ingreso' ? it.monto : -it.monto);
    if (it.tipo === 'Gasto' && it.sobre) { const s = (D.sobres || []).find(x => x.nombre === it.sobre); if (s) s.monto = (Number(s.monto) || 0) - it.monto; }
    (D.historial = D.historial || []).push(mov || { id: Date.now(), tipo: it.tipo, monto: it.monto, desc: it.desc, categoria: it.sobre || it.categoria, cuentaOrigen: c ? c.apodo : '', cuentaId: it.cuentaId, fechaStr: it.fechaStr, refCliente: it.cid });
    cacheD();
}

async function enviarCola(manual) {
    if (enviando) return;
    if (!cola.some(i => !i.fallo)) { if (manual) toast('Nothing to send'); return; }
    enviando = true; let alguno = false, sinRed = false;
    try {
        for (const it of cola.filter(i => !i.fallo)) {
            try {
                const r = await api('movimientoRapido', { cid: it.cid, tipo: it.tipo, monto: it.monto, desc: it.desc, cuentaId: it.cuentaId, categoria: it.categoria, sobre: it.sobre, fechaStr: it.fechaStr });
                cola = cola.filter(x => x.cid !== it.cid); guardarCola(); alguno = true;
                if (!r.duplicado) aplicarEnD(it, r.mov);
            } catch (e) {
                if (e.red) { sinRed = true; break; }   // sin conexión: se reintenta más tarde, en el mismo orden
                if (e.auth) break;
                it.fallo = e.message; guardarCola();    // el servidor la rechazó (por ejemplo, una cuenta que ya no existe)
            }
        }
    } finally { enviando = false; pintar(); }
    if (manual) toast(sinRed ? 'Still no connection' : 'Sent');
    if (alguno) cargar(false);
}

function descartar(cid) {
    if (!confirm('Remove this entry? It could not be sent.')) return;
    cola = cola.filter(x => x.cid !== cid); guardarCola(); pintar();
}

async function cargar(manual) {
    if (cargando) return; cargando = true;
    try {
        // Los gastos que llegaron por correo del banco se anotan en la hoja (la web lo hace al abrirla; el celular lo pide al servidor)
        let nota = '';
        try {
            const b = await api('aplicarBandeja');
            (b.lista || []).forEach(m => notificar(m.tipo === 'Ingreso' ? 'Automatic income registered' : 'Automatic expense registered', `${m.desc} · ${money(m.monto)} · ${m.cuenta}`, { tipo: 'auto' }));
            (b.revisar || []).forEach(r => notificar('Needs your attention', r.detalle, { tipo: 'warning', fija: true, clave: 'rev-' + r.id }));
            if (b.registrados) nota = b.registrados + ' from your bank emails';
            else if (b.sinCuenta) nota = 'A bank email needs an account link (mapa_cuentas)';
        } catch (e) { if (e.red || e.auth) throw e; }
        await enviarCk();
        const r = await api('cargar');
        D = r.datos || {};
        reaplicarCk();
        cacheD();
        pintar();
        enviarCola();
        $('h-sync').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (nota) toast(nota); else if (manual) toast('Up to date');
    } catch (e) {
        $('h-sync').textContent = 'Offline. Showing the last saved data.';
        if (manual) toast(e.message);
    } finally { cargando = false; }
}

const verTodo = { sobres: false, metas: false };
const TIPO_EN = { Gasto: 'Gasto', Ingreso: 'Ingreso', Transferencia: 'Transferencia', 'Préstamo': 'Préstamo' };
const tipoEn = t => TIPO_EN[t] || t || '';
function panel(w) {
    const p = $('p-' + w), abrir = p.style.display === 'none';
    p.style.display = abrir ? (w === 'f' ? 'grid' : 'block') : 'none';
    $('b-' + w).classList.toggle('on', abrir);
    if (abrir && w === 'q') setTimeout(() => $('q-txt').focus(), 50);
}
const esTarjeta = c => c.tipo === 'Tarjeta Crédito';
function pintar() {
    const P = conPendientes();
    const cu = P.cu, hi = P.hi, so = P.so, me = D.metas || [], co = D.compromisos || [], ck = D.checkpay || [];
    $('h-cola').classList.toggle('on', P.n + P.nFallo > 0);
    $('h-cola-txt').innerHTML = P.n ? `<b>${P.n}</b> waiting to send. They go out when you have a connection.` + (P.nFallo ? ` ${P.nFallo} could not be sent (see Activity).` : '') : `<b>${P.nFallo}</b> could not be sent (see Activity).`;
    // Available balance = liquidez, igual que la web (cuentas marcadas - sobres - lo que falta por pagar)
    const L = kodaLiquidez(cu, so, ck, co);
    $('h-total').textContent = money(L.hayMarcadas ? L.libre : cu.reduce((a, c) => a + (Number(c.saldo) || 0), 0));
    const fm = n => (n < 0 ? '-' : '') + money(Math.abs(n));
    $('h-desglose').innerHTML = L.hayMarcadas ? `<div class="r"><span>Spending accounts</span><span>${money(L.base)}</span></div><div class="r"><span>In envelopes</span><span>${fm(-L.enSobres)}</span></div>${L.enBackups > 0 ? `<div class="r"><span>In backups</span><span>${fm(-L.enBackups)}</span></div>` : ''}<div class="r"><span>Left to pay</span><span>${fm(-L.porPagar)}</span></div><div class="r t"><span>Available</span><span>${fm(L.libre)}</span></div>` : '';
    $('h-detalle').textContent = L.hayMarcadas ? '' : (cu.length ? 'Choose your spending account in KODA on your computer.' : '');
    const mes = new Date().toISOString().slice(0, 7);
    const delMes = hi.filter(m => String(m.fechaStr || '').slice(0, 7) === mes);
    $('h-gasto').textContent = money(delMes.filter(m => m.tipo === 'Gasto').reduce((a, m) => a + (Number(m.monto) || 0), 0));
    $('h-ingreso').textContent = money(delMes.filter(m => m.tipo === 'Ingreso').reduce((a, m) => a + (Number(m.monto) || 0), 0));

    $('l-cuentas').innerHTML = cu.length ? cu.map(c => {
        const s = Number(c.saldo) || 0;
        const sub = esTarjeta(c) ? (c.limite ? 'Available ' + money(Number(c.limite) + s) : 'Credit card') : (c.banco || c.tipo || 'Account');
        return `<div class="item tap" onclick="abrirDet('cuenta','${esc(c.id)}')"><div class="dot"><span class="ms">${esTarjeta(c) ? 'credit_card' : 'account_balance'}</span></div><div class="main"><div class="t">${esc(c.apodo)}</div><div class="s">${esc(sub)}</div></div><div class="amt ${s < 0 ? 'neg' : ''}">${money(s)}</div></div>`;
    }).join('') : '<div class="empty">No accounts yet. Add them from KODA on your computer.</div>';

    // Sobres y metas: solo las 3 más cercanas a completarse; el botón despliega todas
    const pct = (a, t) => t > 0 ? Math.max(0, Math.min(100, a / t * 100)) : 0;
    const lista = (idL, idM, arr, tarjeta, clave, vacio, plural) => {
        const ord = arr.slice().sort((x, y) => y._p - x._p), todos = verTodo[clave], vis = todos ? ord : ord.slice(0, 3);
        $(idL).innerHTML = ord.length ? vis.map(tarjeta).join('') : `<div class="card"><div class="empty">${vacio}</div></div>`;
        $(idM).innerHTML = ord.length > 3 ? `<button class="more" onclick="verTodo.${clave} = !verTodo.${clave}; pintar()">${todos ? 'Show less' : `Show all ${plural} (${ord.length})`}</button>` : '';
    };
    lista('l-sobres', 'm-sobres', so.map(s => Object.assign({}, s, { _p: (Number(s.monto) || 0) < 0 ? -1 : pct(Number(s.monto) || 0, Number(s.meta) || 0) })), s => {
        const m = Number(s.monto) || 0, g = Number(s.meta) || 0, p = pct(m, g);
        const estado = m < 0 ? ' over' : (g > 0 && m >= g ? ' full' : '');
        return `<div class="bc${estado}" onclick="abrirDet('sobre','${esc(s.id)}')"><div class="top"><div class="ic">${iconoSobre(s.nombre)}</div><div class="nm">${esc(s.nombre)}</div><div class="vl">${money(m)}</div></div>${g ? `<div class="bar"><div style="width:${p}%"></div></div><div class="sb"><span>${Math.round(p)}% of ${money(g)}</span><span>${m < 0 ? 'Over by ' + money(Math.abs(m)) : (m >= g ? 'Full' : money(g - m) + ' to go')}</span></div>` : ''}</div>`;
    }, 'sobres', 'No envelopes yet.', 'envelopes');
    lista('l-metas', 'm-metas', me.map(m => Object.assign({}, m, { _p: pct(Number(m.montoActual) || 0, Number(m.metaTotal) || 0) })), m => {
        const a = Number(m.montoActual) || 0, t = Number(m.metaTotal) || 0, p = pct(a, t);
        return `<div class="bc${a >= t && t > 0 ? ' full' : ''}" onclick="abrirDet('meta','${esc(m.id)}')"><div class="top"><div class="ic">${kodaIcon('target', { size: 18, stroke: 1.9 })}</div><div class="nm">${esc(m.nombre)}</div><div class="vl">${money(a)}</div></div><div class="bar"><div style="width:${p}%"></div></div><div class="sb"><span>${Math.round(p)}% of ${money(t)}</span><span>${a >= t ? 'Done' : money(t - a) + ' to go'}</span></div></div>`;
    }, 'metas', 'No goals yet.', 'goals');

    // Filtro de la actividad
    const sel = $('q-cta'), prev = sel.value;
    sel.innerHTML = '<option value="">All</option>' + cu.map(c => `<option>${esc(c.apodo)}</option>`).join(''); sel.value = prev;
    const q = ($('q-txt').value || '').trim().toLowerCase(), ft = $('q-tipo').value, fc = sel.value;
    const todos = hi.slice().sort((a, b) => String(b.fechaStr || '').localeCompare(String(a.fechaStr || '')));
    const filtrado = todos.filter(m => (!ft || m.tipo === ft) && (!fc || m.cuentaOrigen === fc) &&

/* ---- Notificaciones (mismas alertas que la web) ---- */
const NK = 'koda_movil_notifs', NR = 'koda_movil_notifs_read', NH = 'koda_movil_notifs_hidden';
let nGuardadas = [], nLeidas = {}, nOcultas = {}, nDerivadas = [];
try { nGuardadas = JSON.parse(localStorage.getItem(NK) || '[]') || []; nLeidas = JSON.parse(localStorage.getItem(NR) || '{}') || {}; nOcultas = JSON.parse(localStorage.getItem(NH) || '{}') || {}; } catch (e) {}
const guardarNotifs = () => { try { localStorage.setItem(NK, JSON.stringify(nGuardadas.slice(0, 60))); localStorage.setItem(NR, JSON.stringify(nLeidas)); localStorage.setItem(NH, JSON.stringify(nOcultas)); } catch (e) {} };
function notificar(titulo, mensaje, o = {}) {
    if (o.clave && (nGuardadas.some(n => n.clave === o.clave) || nOcultas[o.clave])) return;
    nGuardadas.unshift({ id: Date.now() + Math.floor(Math.random() * 1000), tipo: o.tipo || 'info', titulo, mensaje, clave: o.clave || null, fija: !!o.fija, fecha: new Date().toISOString(), leida: false });
    guardarNotifs(); pintarNotifs();
}
function calcularDerivadas(cu, so, me) {
    const L = [], f = n => '$' + Math.abs(Number(n) || 0).toLocaleString('en-US');
    so.forEach(s => { if ((Number(s.monto) || 0) < 0) L.push({ clave: 'sobre-neg-' + s.id, tipo: 'warning', titulo: 'Envelope overdrawn', mensaje: `${s.nombre} is over by ${f(s.monto)}.` }); });
    cu.forEach(c => {
        const sal = Number(c.saldo) || 0, lim = Number(c.limite) || 0;
        if (!esTarjeta(c) && sal < 0) L.push({ clave: 'cuenta-neg-' + c.id, tipo: 'warning', titulo: 'Negative balance', mensaje: `${c.apodo} is at -${f(sal)}.` });
        if (esTarjeta(c) && lim && (lim + sal) <= lim * 0.1) L.push({ clave: 'tc-limite-' + c.id, tipo: 'warning', titulo: 'Credit limit almost used', mensaje: `${c.apodo} has ${f(lim + sal)} available.` });
    });
    const hoy = new Date().toISOString().split('T')[0];
    me.forEach(m => {
        const a = Number(m.montoActual) || 0, t = Number(m.metaTotal) || 0, hecha = m.completadaReal === true || m.completadaReal === 'TRUE' || m.completadaReal === 'true';
        if (hecha) return;
        if (t > 0 && a >= t) L.push({ clave: 'meta-lista-' + m.id, tipo: 'info', titulo: 'Goal reached', mensaje: `${m.nombre} is fully funded. Mark it complete.` });
        else if (m.fechaLimite && String(m.fechaLimite) < hoy) L.push({ clave: 'meta-vencida-' + m.id, tipo: 'warning', titulo: 'Goal past its date', mensaje: `${m.nombre} is ${f(t - a)} short.` });
    });
    return L;
}
function hace(iso) {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    return s < 60 ? 'Just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}
function pintarNotifs() {
    const P = conPendientes();
    nDerivadas = calcularDerivadas(P.cu, P.so, D.metas || []);
    const vivas = new Set(nDerivadas.map(d => d.clave));
    Object.keys(nOcultas).forEach(k => { if (k.indexOf('rev-') !== 0 && !vivas.has(k)) delete nOcultas[k]; });   // si el problema desaparece y vuelve, avisa otra vez
    const der = nDerivadas.filter(d => !nOcultas[d.clave]);
    const todas = nGuardadas.map(n => Object.assign({ stored: true }, n)).concat(der.map(d => Object.assign({ stored: false, leida: !!nLeidas[d.clave] }, d)));
    $('b-notif').classList.toggle('unread', todas.some(n => !n.leida));
    const icono = { error: 'error', warning: 'warning', info: 'info', auto: 'bolt' };
    $('np-list').innerHTML = todas.length ? todas.map(n => `<div class="nitem ${n.leida ? '' : 'new'} ${n.tipo === 'warning' || n.tipo === 'error' ? 'w' : ''}" onclick="abrirNotif('${n.stored ? 'i' + n.id : 'c' + esc(n.clave)}')">
        <div class="ni"><span class="ms" style="font-size:19px">${icono[n.tipo] || 'info'}</span></div>
        <div style="min-width:0;flex:1"><div class="nt"><span>${esc(n.titulo)}</span>${n.fija ? `<button onclick="event.stopPropagation(); borrarNotif(${n.id})" aria-label="Delete" style="color:var(--mut)"><span class="ms" style="font-size:17px">close</span></button>` : (n.leida ? '' : '<span class="nd"></span>')}</div>
        <div class="nm2">${esc(n.mensaje)}</div><div class="nw">${n.stored ? hace(n.fecha) : 'Now'}</div></div></div>`).join('') : '<div class="empty" style="padding:22px 10px">All clear</div>';
}
function toggleNotifs(e) { if (e) e.stopPropagation(); const p = $('np'); p.classList.toggle('on'); if (p.classList.contains('on')) pintarNotifs(); }
document.addEventListener('click', e => { const p = $('np'); if (p.classList.contains('on') && !e.target.closest('#np')) p.classList.remove('on'); });
function abrirNotif(k) {
    if (k[0] === 'i') { const n = nGuardadas.find(x => 'i' + x.id === k); if (n) n.leida = true; } else nLeidas[k.slice(1)] = true;
    guardarNotifs(); $('np').classList.remove('on'); ir('home'); pintarNotifs();
}
function leerTodasNotifs() { nGuardadas.forEach(n => { n.leida = true; }); nDerivadas.forEach(d => { nLeidas[d.clave] = true; }); guardarNotifs(); pintarNotifs(); }
function limpiarNotifs() {
    // Las alertas del sistema se ocultan hasta que el problema desaparezca y vuelva; las fijas (Needs your attention) solo se borran una por una
    nDerivadas.forEach(d => { nOcultas[d.clave] = true; });
    nGuardadas = nGuardadas.filter(n => n.fija);
    guardarNotifs(); pintarNotifs();
}
function borrarNotif(id) {
    const n = nGuardadas.find(x => x.id === id);
    if (n && n.clave) nOcultas[n.clave] = true;   // no vuelve a aparecer en este teléfono
    nGuardadas = nGuardadas.filter(x => x.id !== id); guardarNotifs(); pintarNotifs();
}

/* ---- Arrastrar hacia abajo para recargar ---- */
let ptrY = null, ptrListo = false;
const ptrBloqueado = e => document.body.classList.contains('chat-on') || document.body.classList.contains('sheet-on') || document.body.classList.contains('ed-on') || document.body.classList.contains('det-on') || e.composedPath().some(n => n.id === 'kt-overlay');
addEventListener('touchstart', e => { ptrY = (scrollY <= 0 && !ptrBloqueado(e)) ? e.touches[0].clientY : null; ptrListo = false; }, { passive: true });
addEventListener('touchmove', e => {
    if (ptrY == null) return;
    const dy = e.touches[0].clientY - ptrY, p = $('ptr');
    if (dy <= 0) { p.style.height = '0'; ptrListo = false; return; }
    p.style.height = Math.min(34, dy / 3) + 'px'; ptrListo = dy > 110;
    p.textContent = ptrListo ? 'Release to refresh' : 'Pull to refresh';
}, { passive: true });
addEventListener('touchend', () => {
    if (ptrY == null) return;
    const ir_ = ptrListo; ptrY = null; ptrListo = false; $('ptr').style.height = '0';
    if (ir_) { cargar(true); }
}, { passive: true });

/* ---- Inicio ---- */
try { const c = JSON.parse(localStorage.getItem('koda_movil_cache') || 'null'); if (c && c.D) { D = c.D; pintar(); $('h-sync').textContent = 'Showing saved data...'; } } catch (e) {}
if (cfg) cargar(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) { enviarCola(); cargar(false); } });
window.addEventListener('online', () => enviarCola());
setInterval(() => { if (cfg && cola.some(i => !i.fallo)) enviarCola(); }, 15000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
